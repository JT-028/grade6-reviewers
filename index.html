<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 6 study guides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe6;
    --ink: #1f2a1c;
    --ink-soft: #4a5544;
    --leaf: #2e5d3a;
    --cream: #faf6ec;
    --shadow: rgba(31, 42, 28, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "DM Sans", sans-serif;
  }
  main {
    max-width: 28rem;
    margin: 0 auto;
    padding: 2.75rem 1.25rem 3rem;
  }
  .eyebrow {
    margin: 0;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--leaf);
  }
  h1 {
    margin: 0.4rem 0 0.6rem;
    font-family: Fraunces, serif;
    font-size: clamp(2.2rem, 8vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .lead {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1.05rem;
    line-height: 1.5;
  }
  nav {
    display: grid;
    gap: 0.75rem;
    margin-top: 1.75rem;
  }
  a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 4.5rem;
    padding: 1rem 1.15rem;
    border-radius: 1rem;
    background: var(--cream);
    color: var(--ink);
    text-decoration: none;
    box-shadow: 0 8px 24px var(--shadow);
  }
  a:hover { background: #fff; }
  a:focus-visible {
    outline: 3px solid var(--leaf);
    outline-offset: 3px;
  }
  .subject {
    font-family: Fraunces, serif;
    font-size: 1.45rem;
    font-weight: 600;
  }
  .meta {
    color: var(--ink-soft);
    font-size: 0.9rem;
    font-weight: 700;
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Grade 6 · Quarter 1</p>
  <h1>Study guides</h1>
  <p class="lead">Tap a subject. It opens in this browser.</p>
  <nav aria-label="Subjects">
    <a href="History6_Review_Module_v1.0.0.html">
      <span class="subject">History</span>
      <span class="meta">Open</span>
    </a>
    <a href="Math6_Review_Module_v1.0.0.html">
      <span class="subject">Math</span>
      <span class="meta">Open</span>
    </a>
    <a href="Geography6_Review_Module_v1.0.0.html">
      <span class="subject">Geography</span>
      <span class="meta">Open</span>
    </a>
    <a href="Language6_Review_Module_v1.0.0.html">
      <span class="subject">Language</span>
      <span class="meta">Open</span>
    </a>
  </nav>
</main>
</body>
</html>
